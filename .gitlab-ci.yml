stages:
  - quality

variables:
  GOPATH: "$CI_PROJECT_DIR/.gocache"
  GOMODCACHE: "$CI_PROJECT_DIR/.gocache/mod"

quality:
  stage: quality
  image: ubuntu:24.04
  cache:
    key: "quality-$CI_COMMIT_REF_SLUG"
    paths:
      - .gocache/
      - src/edge/node_modules/
      - src/mcp/.venv/
  before_script:
    - apt-get update && apt-get install -y curl git make ca-certificates build-essential
    - curl -fsSL https://go.dev/dl/go1.26.1.linux-amd64.tar.gz | tar -C /usr/local -xzf -
    - export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH=$PATH:/root/.local/bin
    - make install-tools
    - (cd src/edge && npm ci)
    - (cd src/mcp && uv sync)
  script:
    - make quality
