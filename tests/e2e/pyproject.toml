[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# This is a flat-layout tree with several non-package sibling dirs (fixtures/,
# aws-edge/, fastly-edge/, mock-publisher/). Restrict package discovery to the
# importable `harness` package (+ its subpackages) so the editable build that
# `make test-e2e-aws` performs (uv run --with-editable .) does not fail with
# setuptools' "Multiple top-level packages discovered in a flat-layout" error.
[tool.setuptools.packages.find]
include = ["harness*"]

[project]
name = "ramp-e2e"
version = "0.0.1"
description = "Full-stack E2E harness for the RAMP demo (docker-compose)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # RFC 9421 signer in tests/e2e/harness/catalog_push.py (PushResources RPC).
    "cryptography>=44.0.0",
    "rfc8785>=0.1.4",
    # Docker SDK for Python — used by obligation tests that drive container
    # lifecycle (restart, inspect, exec) directly against the docker socket
    # instead of shelling out to the docker CLI. Required because the runner
    # image (tests/e2e/Dockerfile) does NOT carry docker-cli; the SDK reaches
    # the docker daemon over the bind-mounted socket. Shelling out to `docker`
    # from inside the runner fails with "command not found", which is what
    # drove the switch to the SDK.
    "docker>=7.0",
    # MCP client + JWT minting for the identity MCP-endpoint e2e
    # (test_mcp_endpoint.py drives the Go adapter over the MCP protocol).
    "fastmcp>=2.0",
    "pyjwt>=2.9",
    # Parses .github/workflows/*.yml for the workflow-script guard
    # (test_guards_workflow_scripts.py). It is already installed as a transitive
    # dependency of fastmcp, which is exactly why it is named here: a guard that
    # rides on another package's dependency tree stops running the day that tree
    # changes, and nothing would say so.
    "pyyaml>=6.0",
    # L1 protocol-mechanics helpers (thumbprint, RFC 9421 sign, JCS acceptance,
    # base64url) — the harness's former hand-rolled copies now import these.
    "ramp-protocol-sdk",
    # Generated wire types (the `wire` package). ramp_sdk.acceptance imports
    # `wire.models`, so the SDK is unusable without it. The harness used to get
    # this transitively through the in-tree Python shim; the shim is gone (the MCP
    # surface is the Go adapter), so it is named directly here.
    "ramp-protocol",
]

[tool.uv.sources]
# Pinned off-commit from the protocol git repo (subdirectory=sdk/python). The pin
# must match the Go module pin in the root go.mod, so the harness signs with the
# same canonical wire form the services verify. No sibling checkout required.
# Switch to a published release pin once one exists.
ramp-protocol-sdk = { git = "https://github.com/RAMP-Protocol/protocol.git", subdirectory = "sdk/python", rev = "5a2674e6617202a792a8e57362fce32cb5d2db7e" }
# Generated wire types, pinned off the SAME revision as the SDK above — a split
# between the two would mean the harness signs one payload shape and the services
# verify another.
ramp-protocol = { git = "https://github.com/RAMP-Protocol/protocol.git", subdirectory = "gen/python", rev = "5a2674e6617202a792a8e57362fce32cb5d2db7e" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["harness"]
# ADR-008 D5 — unknown markers fail the run so a typo'd
# `@pytest.mark.stack_isoaltion("...")` doesn't silently no-op.
addopts = "--strict-markers"
strict_markers = true
markers = [
    "stack_isolation(mode): declare per-test isolation contract (ADR-008 D5) — one of 'isolated', 'shared-clean-fixtures', 'shared-without-cleanup'",
]

[dependency-groups]
# Lint-only dev group. Test execution lives in docker-compose (`make test-e2e`)
# and does not require these tools; the host-side `make lint` / `make fmt`
# delegation does. `ruff` here is what `tests/e2e/Makefile` resolves via
# `uv run ruff …`, closing the gap where this tree was linted by no host-side
# target at all.
dev = [
    "ruff>=0.9.0",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

# This is a TEST harness — every file is test infrastructure. The selection
# below pins ruff's default rule set (E4/E7/E9 + F) explicitly so the host-side
# `make lint` and a bare `ruff check .` run from this directory stay
# aligned — the two must not disagree about which rules apply. Heavier
# rule families (PL/SIM/PERF/TCH/I/etc.) are intentionally OFF because this
# tree is harness code, not production logic.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (ruff default subset)
    "F",               # pyflakes (includes F401 unused-import, F841 unused-local)
]

[tool.mypy]
python_version = "3.12"
# Deliberately not strict — see tests/e2e/Makefile:typecheck for why. The point
# is that a Python type gate exists and runs in `make quality` again; tightening
# it is a separate, incremental job.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
