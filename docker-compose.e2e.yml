# Local full-stack E2E compose: brings up Postgres, Redis, Exchange, Broker,
# Miniflare-hosted edge worker, and a mock publisher origin. A pytest harness
# (tests/e2e/harness/test_full_stack.py) drives the stack end-to-end.
#
#   docker compose -f docker-compose.e2e.yml up -d --build
#   ... run tests ...
#   docker compose -f docker-compose.e2e.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ramp
      POSTGRES_PASSWORD: ramp
      POSTGRES_DB: ramp
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramp -d ramp"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  publisher:
    image: nginx:alpine
    volumes:
      - ./tests/e2e/mock-publisher/content:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/premium/article-42.html || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  exchange:
    build:
      context: .
      dockerfile: src/exchange/Dockerfile
    environment:
      EXCHANGE_DSN: "postgres://ramp:ramp@postgres:5432/ramp?sslmode=disable"
      EXCHANGE_ADDR: ":8081"
      EXCHANGE_DOMAIN: "exchange.e2e.local"
      # Pre-seed the in-memory billing adapter so the test agent can transact.
      EXCHANGE_BILLING_SEED: '{"agent-e2e":{"value":"100.00","currency":"USD"}}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/exchange", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "18081:8081"

  broker:
    build:
      context: .
      dockerfile: src/broker/Dockerfile
    extra_hosts:
      # On Linux, Docker doesn't auto-wire this; make it explicit so the Broker
      # can probe edge URIs authored with host.docker.internal in CI.
      - "host.docker.internal:host-gateway"
    environment:
      BROKER_DSN: "postgres://ramp:ramp@postgres:5432/ramp?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      BROKER_ADDR: ":8082"
      BROKER_ID: "broker-e2e"
      BROKER_DOMAIN: "broker.e2e.local"
      # Compose network is HTTP-only; override from default https.
      RAMP_PROBE_SCHEME: "http"
      # EXA_API_KEY deliberately empty — pytest drives the flow with direct URIs.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      exchange:
        condition: service_started
    ports:
      - "18082:8082"

  edge:
    build:
      context: src/edge
      dockerfile: Dockerfile.miniflare
    environment:
      EXCHANGE_URL: "http://exchange:8081"
      # Edge's `keys.ts` doesn't use the default JWKS path — it fetches whatever
      # JWKS_URL points at. The Exchange serves its JWKS at /marketplace/v1/keys.
      JWKS_URL: "http://exchange:8081/marketplace/v1/keys"
      MARKETPLACE_MANIFEST_URL: "http://exchange:8081/.well-known/ramp-marketplace.json"
      ORIGIN_URL: "http://publisher:80"
      PROVIDER: "edge.e2e.local"
      EXCHANGES_JSON: '[{"domain":"exchange.e2e.local","endpoint":"http://exchange:8081","supported_profiles":["ramp-news-v1"]}]'
      RSL_BODY: "# e2e rsl"
    depends_on:
      exchange:
        condition: service_started
      publisher:
        condition: service_healthy
    ports:
      - "18787:8787"

  fastly-edge:
    # Fastly Compute runtime via Viceroy (`fastly compute serve`). Same Hono
    # app as the Miniflare edge, compiled to WASM via @fastly/js-compute.
    build:
      context: .
      dockerfile: tests/e2e/fastly-edge/Dockerfile
      platforms:
        - linux/amd64
    environment:
      EXCHANGE_URL: "http://exchange:8081"
      JWKS_URL: "http://exchange:8081/marketplace/v1/keys"
      MARKETPLACE_MANIFEST_URL: "http://exchange:8081/.well-known/ramp-marketplace.json"
      ORIGIN_URL: "http://publisher:80"
      PROVIDER: "fastly-edge.e2e.local"
      EXCHANGES_JSON: '[{"domain":"exchange.e2e.local","endpoint":"http://exchange:8081","supported_profiles":["ramp-news-v1"]}]'
      RSL_BODY: "# e2e rsl fastly"
    depends_on:
      exchange:
        condition: service_started
      publisher:
        condition: service_healthy
    ports:
      - "17676:7676"

  aws-edge:
    # CloudFront canned-policy signed-URL verifier stand-in. Proves the RSA
    # chain round-trip locally without requiring a real CloudFront distro.
    build:
      context: tests/e2e/aws-edge
    environment:
      EXCHANGE_URL: "http://exchange:8081"
      ORIGIN_URL: "http://publisher:80"
      PROVIDER: "aws-edge.e2e.local"
      EXCHANGES_JSON: '[{"domain":"exchange.e2e.local","endpoint":"http://exchange:8081","supported_profiles":["ramp-news-v1"]}]'
      PORT: "8788"
    depends_on:
      exchange:
        condition: service_started
      publisher:
        condition: service_healthy
    ports:
      - "18788:8788"

  mcp:
    build:
      context: src/mcp
      dockerfile: Dockerfile
    environment:
      RAMP_MCP_TRANSPORT: "http"
      RAMP_MCP_HOST: "0.0.0.0"
      RAMP_MCP_PORT: "8000"
      BROKER_URL: "http://broker:8082"
      RAMP_AGENT_ID: "agent-e2e"
    depends_on:
      broker:
        condition: service_started
    ports:
      - "18000:8000"

  runner:
    # Opt-in: `docker compose --profile test run --rm runner` executes the suite.
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    environment:
      RAMP_E2E_REUSE_STACK: "1"
      RAMP_E2E_KEEP_UP: "1"
      RAMP_E2E_IN_NETWORK: "1"
      RAMP_E2E_COMPOSE_FILE: "/runner/docker-compose.e2e.yml"
    volumes:
      - ./docker-compose.e2e.yml:/runner/docker-compose.e2e.yml:ro
    depends_on:
      exchange:
        condition: service_started
      broker:
        condition: service_started
      edge:
        condition: service_started
      aws-edge:
        condition: service_started
      fastly-edge:
        condition: service_started
      mcp:
        condition: service_started
      postgres:
        condition: service_healthy
