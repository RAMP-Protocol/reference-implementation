---
# Broker exchange bootstrap. Each entry is reconciled into broker.exchanges
# on startup. Add / remove entries here to change which Exchanges the Broker
# routes through. Trust level drives ranking; only VERIFIED and PREFERRED
# exchanges are used in production flows.
exchanges:
  - id: mp-acme
    domain: mp.acme.example
    endpoint: https://mp.acme.example
    trust_level: VERIFIED
    priority: 100
    supported_profiles:
      - ramp-news-v1
      - ramp-academic-v1
  - id: mp-bravo
    domain: mp.bravo.example
    endpoint: https://mp.bravo.example
    trust_level: DISCOVERED
    priority: 50
    supported_profiles:
      - ramp-news-v1
