authors = ["RAMP"]
description = "RAMP edge verifier (Fastly Compute)"
language = "javascript"
manifest_version = 3
name = "ramp-edge-fastly"
service_id = ""

[scripts]
build = "npm run build:fastly"

[local_server]
[local_server.env_vars]
EXCHANGE_URL = "http://localhost:8080"
# Unified manifest: the edge fetches public_keys[] from here to resolve the
# Ed25519 delivery-URL verify key.
EXCHANGE_MANIFEST_URL = "http://localhost:8080/.well-known/ramp.json"
