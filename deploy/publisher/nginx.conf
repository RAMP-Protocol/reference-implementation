# E2E origin nginx: serves the baseline mock-publisher tree at the default
# docroot AND the Phase-2 demo content tree under its own docroot, routed by
# path prefix. The demo publishers use disjoint prefixes (/articles, /lyrics,
# /tracks, /sfx) so there is no collision with the baseline tree
# (/premium, /public, /paid, /.well-known). Separate roots avoid mounting demo
# subtrees underneath the read-only baseline docroot (which the daemon cannot
# create child mountpoints in).
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events { worker_connections 64; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name _;

        # Baseline mock-publisher tree (article-42, licensed-paper, public/, etc.).
        root /usr/share/nginx/html;

        # Human-facing landing page: the demo catalog index at the site root.
        # A person opening the demo hostname in a browser lands here; every
        # other path keeps its routing below (exact match). try_files serves
        # the file inside this location — an `index` directive would instead
        # internally redirect to /index.html, re-match locations, and fall
        # into the baseline docroot where the file does not exist.
        location = / {
            root /usr/share/nginx/demo;
            try_files /index.html =404;
        }

        # Phase-2 demo publisher content. Each prefix maps to the matching
        # subtree under /usr/share/nginx/demo. The edge forwards the signed-URL
        # path verbatim, so e.g. /articles/philosophers/thales-of-miletus.txt is
        # read straight from the Stoa Press tree.
        location /articles/ { root /usr/share/nginx/demo/stoa-press; }
        location /lyrics/   { root /usr/share/nginx/demo/harmonia-records; }
        location /tracks/   { root /usr/share/nginx/demo/harmonia-records; }
        location /sfx/      { root /usr/share/nginx/demo/foleyworks; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
