version: "2"

run:
  timeout: 5m
  tests: true

severity:
  default: error

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - nilerr
    - noctx
    - wastedassign

    # Security
    - gosec

    # Style / complexity / size
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - lll
    - maintidx
    - nestif
    - revive
    - unconvert
    - unparam
    - misspell
    - prealloc
    - gocritic

    # Architecture
    - depguard
    # ADR-008 D1: time is a port; the wall clock is a leaf.
    - forbidigo
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120
      tab-width: 1
    maintidx:
      under: 20
    nestif:
      min-complexity: 5
    gosec:
      excludes:
        - G104 # handled by errcheck
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: file-length-limit
          arguments:
            - max: 500
              skipBlankLines: false
              skipComments: false
    depguard:
      rules:
        no-circular-internal:
          deny:
            # Services must not depend on each other.
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/exchange"
              desc: "broker must not import exchange internals; use protocol via Connect-Go"
            - pkg: "gitlab.postindustria.com/pi-ai/prebid-agentic-content-access/src/broker"
              desc: "exchange must not import broker internals; use protocol via Connect-Go"
          files:
            - "!**/src/broker/**"
            - "!**/src/exchange/**"
    # ADR-008 D1 — wall-clock primitives are forbidden inside the policy
    # trees. Production code consults the injected clock.Clock; only the
    # canonical leaf in internal/clock and the production roots that
    # construct clock.System{} may reference time.Now / time.Since /
    # time.Until directly. The allowlist below is enforced via per-path
    # exclusions further down (see "exclusions").
    forbidigo:
      analyze-types: false
      forbid:
        - pattern: '^time\.Now$'
          msg: "ADR-008 D1: consult the injected clock.Clock, not time.Now"
        - pattern: '^time\.Since$'
          msg: "ADR-008 D1: derive elapsed time from clock.Clock.Now(), not time.Since"
        - pattern: '^time\.Until$'
          msg: "ADR-008 D1: derive remaining time from clock.Clock.Now(), not time.Until"

  exclusions:
    rules:
      # ADR-008 D1 forbidigo allowlist: the canonical clock leaf.
      - path: 'internal/clock/'
        linters:
          - forbidigo
      # Production roots may reference the wall clock when constructing
      # the system clock or stamping startup-time metadata that does not
      # gate behaviour at request time.
      - path: 'src/exchange/cmd/server/'
        linters:
          - forbidigo
      - path: 'src/broker/cmd/server/'
        linters:
          - forbidigo
      # Tests are exempt — they construct deterministic clocks of their
      # own choosing and may read the wall clock to derive a fixed anchor.
      - path: _test\.go
        linters:
          - forbidigo
      # Relax a few size/security lints inside tests only.
      - path: _test\.go
        linters:
          - gosec
          - gocyclo
          - gocognit
          - funlen
          - lll
          - maintidx
      # Generated code is exempt across the board.
      - path: 'internal/db/sqlc/'
        linters:
          - revive
          - unused
          - gosec
          - lll
          - gocritic
      # gosec G705 (XSS via taint analysis) does not apply to the Broker's
      # writeProtoJSON: the payload is server-built canonical proto-JSON written
      # with Content-Type application/json, never user-reflected HTML.
      - path: 'src/broker/internal/transport/middleware.go'
        text: 'G705'
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
